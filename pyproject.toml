[project]
name = "hamboorgueria"
version = "0.1.0"
description = "App web para hamburgueria"
authors = [
    {name = "Hugus Albuquerque",email = "hugus.albuquerque@gmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]>=0.45.0,<0.46.0",
    "sqlmodel>=0.0.38,<0.0.39",
    "jinja2>=3.1.6,<4.0.0",
    "python-multipart>=0.0.26,<0.0.27",
    "aiosqlite>=0.22.1,<0.23.0",
    "python-dotenv>=1.2.2,<2.0.0"
]


[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
