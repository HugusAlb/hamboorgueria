<div class="bg-green-50 border border-green-300 rounded-xl p-6 max-w-md">
  <p class="text-green-700 font-bold text-lg mb-1">Pedido realizado!</p>
  <p class="text-gray-700">
    Seu código é <span class="text-2xl font-bold text-yellow-600">{{ pedido.codigo }}</span>.
    Guarde para acompanhar o status.
  </p>
  <ul class="mt-4 divide-y divide-green-100 text-sm text-gray-700">
    {% for item in itens %}
    <li class="py-1">{{ item.quantidade }}x {{ item.nome }}</li>
    {% endfor %}
  </ul>
  <button onclick="
    document.getElementById('resultado-pedido').innerHTML = '';
  " class="mt-4 w-full bg-yellow-500 hover:bg-yellow-600 text-white font-semibold py-2 rounded-lg">
    Acompanhar meu pedido
  </button>
</div>
