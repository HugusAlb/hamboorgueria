{% extends "base.html" %}
{% block title %}Cozinha{% endblock %}
{% block content %}

<!-- Safelist de classes condicionais para o Tailwind CDN não perder no HTMX swap -->
<div class="hidden border-red-500 border-yellow-400 border-green-500
            bg-yellow-400 hover:bg-yellow-500 bg-green-500 hover:bg-green-600
            bg-red-100 text-red-700 bg-yellow-100 text-yellow-700
            bg-green-100 text-green-700 bg-blue-100 text-blue-700"></div>

<h1 class="text-3xl font-bold mb-6 text-gray-800">Cozinha</h1>

<!-- Solicitações de edição -->
<div hx-ext="sse" sse-connect="/sse/cozinha">
  <div id="solicitacoes-edicao"
       hx-get="/api/cozinha/solicitacoes"
       hx-trigger="load, sse:update, every 15s"
       hx-swap="innerHTML">
    {% include "partials/solicitacoes_edicao.html" %}
  </div>

  <!-- Pedidos ativos -->
  <div id="pedidos-lista"
       hx-get="/api/cozinha/pedidos-ativos"
       hx-trigger="sse:update, every 15s"
       hx-swap="innerHTML"
       class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
    {% include "partials/pedidos_cozinha.html" %}
  </div>
</div>

{% endblock %}
